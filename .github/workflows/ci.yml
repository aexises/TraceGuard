name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never
  PYTHON_IMAGE: python@sha256:25976e9d34a0fab1f278cae931f34c8303d97bf0c0d7f85b6b4dcf641d7702a4

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.1
      - run: uv lock --check
      # Install build dependencies from the lock before building the project itself.
      - run: uv sync --locked --extra dev --no-install-project
      - run: uv sync --locked --extra dev --no-build-isolation --no-editable
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest -ra
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - run: cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/traceguard" smoke
      - run: >-
          cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/python" -c
          "from traceguard.experiments import default_ablations_path, load_ablations;
          from traceguard.sandbox.config import default_sandbox_configuration_path,
          load_sandbox_configuration;
          from importlib.resources import files;
          load_ablations(default_ablations_path());
          load_sandbox_configuration(default_sandbox_configuration_path());
          files('traceguard').joinpath('prompts/supervisor_v2.txt').read_text();
          files('traceguard').joinpath('data/policy/effects.json').read_text()"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra dev --extra agentdojo --no-install-project
      - run: uv sync --locked --extra dev --extra agentdojo --no-build-isolation --no-editable
      - run: uv run --no-sync python -m pytest tests/test_hardening.py tests/supervisor -q -ra
      - run: docker pull "$PYTHON_IMAGE"
      - run: uv run --no-sync traceguard sandbox-check
      - run: uv run --no-sync python -m pytest tests/sandbox -q -ra
        env:
          TRACEGUARD_RUN_DOCKER_TESTS: "1"
      - run: docker build --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" --tag traceguard:ci .
      - name: Reject missing API configuration
        run: |
          status=0
          timeout 15s docker run --rm --name traceguard-unconfigured-ci traceguard:ci || status=$?
          test "$status" -eq 1
      - name: Check API with Kubernetes filesystem restrictions
        run: |
          docker run -d --name traceguard-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 10001 -p 127.0.0.1:8080:8080 \
            -e TRACEGUARD_ALLOW_IN_MEMORY=1 \
            -e TRACEGUARD_SIGNING_KEY="$(openssl rand -hex 32)" \
            -e TRACEGUARD_DEV_TOKEN="$(openssl rand -hex 32)" traceguard:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs traceguard-ci
          exit 1
      - name: Render manifest for schema validation only
        run: |
          IMAGE_ID=$(docker inspect --format '{{.Id}}' traceguard:ci)
          uv run --no-sync traceguard release-validate --base-image "$PYTHON_IMAGE" \
            --release-image "registry.invalid/traceguard@$IMAGE_ID" \
            --output-manifest artifacts/control-plane.yaml
          # This image ID is a schema-only fixture, not a deployable registry manifest digest.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: kubeconform -strict -summary -kubernetes-version 1.27.0 artifacts/control-plane.yaml
      - name: Cleanup
        if: always()
        run: docker rm -f traceguard-ci traceguard-unconfigured-ci || true
