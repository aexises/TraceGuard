[project]
name = "traceguard-agentdyn-environment"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "agentdojo @ git+https://github.com/SaFo-Lab/AgentDyn.git@5353cf7615b135cace8d07c8f12dac53a16b6db3",
  "google-cloud-aiplatform>=1.133.0,<2",
  "pydantic-ai>=2.53.0,<3",
]

[tool.uv]
package = false
# Upstream requests the obsolete vertexai alias, which pins a vulnerable SDK.
# The maintained google-cloud-aiplatform distribution above supplies vertexai.
# This is an explicit dependency substitution, not an advisory suppression.
exclude-dependencies = ["vertexai"]
