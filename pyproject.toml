[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traceguard"
version = "0.1.0"
description = "Safety control plane for governing AI model and agent actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.2,<51",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "jsonschema==4.25.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0", "openai>=1.0", "certifi>=2026.10.19"]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
inspect = [
  "inspect-ai==0.3.281",
  "certifi>=2026.10.19",
]

[project.scripts]
traceguard = "traceguard.cli:main"
traceguard-api = "traceguard.control.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard"]

[tool.hatch.build.targets.wheel.force-include]
"configs/sandbox_profiles.json" = "traceguard/data/configs/sandbox_profiles.json"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = ["aiohttp>=3.14.5", "certifi>=2026.10.19"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/traceguard/control/service.py" = ["E501"]
"src/traceguard/control/api.py" = ["B008", "E501"]
"src/traceguard/sdk.py" = ["E501"]
"tests/test_control_plane.py" = ["E501"]
