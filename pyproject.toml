[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traceguard"
version = "0.1.0"
description = "Safety control plane for governing AI model and agent actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0", "openai>=1.0"]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
agentdojo = ["agentdojo==0.1.35"]
datasets = ["datasketch==2.0.0"]
inspect = [
  "inspect-ai==0.3.248",
  "inspect-evals==0.15.0",
]

[project.scripts]
traceguard = "traceguard.cli:main"
traceguard-api = "traceguard.control.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard", "benchmarks", "react_agentdojo"]

[tool.hatch.build.targets.wheel.force-include]
"configs/ablations.json" = "traceguard/data/configs/ablations.json"
"configs/sandbox_profiles.json" = "traceguard/data/configs/sandbox_profiles.json"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/agentdojo_runner.py" = ["E501", "I001"]
"react_agentdojo/agentdojo_react_benchmark.py" = ["E402", "E501", "E731"]
"src/traceguard/control/service.py" = ["E501"]
"src/traceguard/control/api.py" = ["B008", "E501"]
"src/traceguard/sdk.py" = ["E501"]
"tests/test_control_plane.py" = ["E501"]
